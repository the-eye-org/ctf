name: Validate and build THE EYE

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eye-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/the-eye-org/ctf

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env: &app_env
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
      FLAG_HMAC_KEY: ${{ secrets.FLAG_HMAC_KEY }}
      VARIANT_HMAC_KEY: ${{ secrets.VARIANT_HMAC_KEY }}
      COORD_HMAC_KEY: ${{ secrets.COORD_HMAC_KEY }}
      REVEAL_ENC_KEY: ${{ secrets.REVEAL_ENC_KEY }}
      CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
      FLAG_PREFIX: ${{ vars.FLAG_PREFIX }}
      EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
      MAX_SESSIONS_PER_TEAM: ${{ vars.MAX_SESSIONS_PER_TEAM }}
      REALTIME_CHANNEL_PREFIX: ${{ vars.REALTIME_CHANNEL_PREFIX }}
      ARGON2_MEMORY_KIB: ${{ vars.ARGON2_MEMORY_KIB }}
      ARGON2_TIME_COST: ${{ vars.ARGON2_TIME_COST }}
      ARGON2_PARALLELISM: ${{ vars.ARGON2_PARALLELISM }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Archive application build
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -czf app-build.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app-build.tar.gz
          retention-days: 1

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: [validate, build]
    env: *app_env
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/download-artifact@v4
        with:
          name: app-build
      - name: Extract application build
        run: mkdir -p app-build && tar -xzf app-build.tar.gz -C app-build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: ctf/Dockerfile
      - name: Prepare embedded runtime settings
        run: |
          node <<'NODE'
          const names = ['DATABASE_URL', 'DIRECT_DATABASE_URL', 'SESSION_PEPPER', 'FLAG_HMAC_KEY', 'VARIANT_HMAC_KEY', 'COORD_HMAC_KEY', 'REVEAL_ENC_KEY', 'CSRF_SECRET', 'FLAG_PREFIX', 'EVENT_TIMEZONE', 'MAX_SESSIONS_PER_TEAM', 'REALTIME_CHANNEL_PREFIX', 'ARGON2_MEMORY_KIB', 'ARGON2_TIME_COST', 'ARGON2_PARALLELISM'];
          const settings = Object.fromEntries(names.map(name => {
            if (!process.env[name]) throw new Error(`Missing ${name}`);
            return [name, process.env[name]];
          }));
          require('node:fs').writeFileSync('runtime-env.json', JSON.stringify(settings), {mode: 0o600});
          NODE
      - name: Build immutable image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          secret-files: |
            runtime_env=runtime-env.json
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
      - name: Notify Jenkins with immutable image
        env:
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
        run: |
          test -n "$JENKINS_WEBHOOK_URL"
          # The college Jenkins chain is incomplete; certificate verification is
          # disabled for this trigger at the deployment owner's explicit request.
          curl --proto '=https' --insecure --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --get --data-urlencode "IMAGE_REF=$IMAGE_NAME:$GITHUB_SHA" "$JENKINS_WEBHOOK_URL"
